name: CI

on:
  # Run on every branch push so a branch is checked before a pull request exists.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  scripts:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './target/*' -print0)

      - name: Lint shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './target/*' -print0 | \
            xargs -0 -r shellcheck --severity=warning

  msrv:
    name: minimum supported Rust (1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Run all tests with the declared MSRV
        run: cargo test --locked --all-targets -- --test-threads=1

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit locked dependencies
        # cargo-audit reads Cargo.lock by default; unlike Cargo itself, the
        # subcommand does not expose a --locked flag.
        run: cargo audit

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep the unit/integration suite exercised on both supported hosted
        # Ubuntu generations; rootful namespace tests stay in their dedicated
        # jobs below so a kernel capability failure is reported separately.
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run all tests (serialized)
        # Several parser/store tests intentionally exercise process-wide
        # environment overrides; serialize them to avoid test-thread races.
        run: cargo test --locked --all-targets -- --test-threads=1

  test-release:
    name: cargo test (release profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run all tests in release mode
        # Release-only optimization and panic settings are part of the
        # shipped binary, so exercise the suite under the production profile.
        run: cargo test --locked --release --all-targets -- --test-threads=1

  build:
    name: release build (gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

  smoke:
    name: rootful runtime smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build test binary
        run: cargo build --locked

      - name: Install static BusyBox
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static

      - name: Run isolated rootfs smoke test
        run: |
          set +e
          rootfs="$RUNNER_TEMP/zerun-smoke-rootfs"
          data="$RUNNER_TEMP/zerun-smoke-data"
          runtime="$RUNNER_TEMP/zerun-smoke-runtime"
          mkdir -p "$rootfs/bin" "$data" "$runtime"
          install -m 0755 /usr/bin/busybox "$rootfs/bin/busybox"
          ln -s busybox "$rootfs/bin/sh"

          sudo env \
            ZERUN_DATA_ROOT="$data" \
            ZERUN_RUNTIME_ROOT="$runtime" \
            target/debug/zerun run --rootfs "$rootfs" --net none --init -- \
            /bin/sh -c 'printf "zerun-smoke-ok\n"; exit 23' >"$RUNNER_TEMP/zerun-smoke.log" 2>&1
          status=$?
          set -e

          cat "$RUNNER_TEMP/zerun-smoke.log"
          test "$status" -eq 23
          grep -Fx zerun-smoke-ok "$RUNNER_TEMP/zerun-smoke.log"

      - name: Run detached lifecycle smoke test
        run: |
          set -euo pipefail
          rootfs="$RUNNER_TEMP/zerun-detached-rootfs"
          data="$RUNNER_TEMP/zerun-detached-data"
          runtime="$RUNNER_TEMP/zerun-detached-runtime"
          mkdir -p "$rootfs/bin" "$data" "$runtime"
          install -m 0755 /usr/bin/busybox "$rootfs/bin/busybox"
          ln -s busybox "$rootfs/bin/sh"

          zerun=(sudo env
            ZERUN_DATA_ROOT="$data"
            ZERUN_RUNTIME_ROOT="$runtime"
            target/debug/zerun)

          id="$("${zerun[@]}" run -d --rootfs "$rootfs" --no-overlay --net none \
            --init --name ci-detached -- /bin/sh -c \
            'printf "detached-smoke\n"; sleep 30')"
          test -n "$id"
          test "$("${zerun[@]}" ps -q)" = "$id"
          for attempt in $(seq 1 50); do
            output="$("${zerun[@]}" logs "$id" 2>/dev/null || true)"
            if grep -Fx detached-smoke <<<"$output"; then
              break
            fi
            if test "$attempt" -eq 50; then
              echo "detached workload output was not captured" >&2
              exit 1
            fi
            sleep 0.1
          done

          "${zerun[@]}" kill --signal TERM "$id"
          wait_output="$("${zerun[@]}" wait "$id")"
          test "$wait_output" = 143
          "${zerun[@]}" ps -a -q | grep -Fx "$id"

          "${zerun[@]}" rm "$id"
          test -z "$("${zerun[@]}" ps -a -q)"

  rootless-smoke:
    name: rootless runtime smoke test
    # Ubuntu 24.04 hosted images apply an AppArmor restriction to unprivileged
    # user namespaces. Keep this job on 22.04 so it exercises Zerun's actual
    # rootless clone/mapping path rather than failing before the runtime starts.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build test binary
        run: cargo build --locked

      - name: Install static BusyBox
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static

      - name: Run rootless namespace smoke test
        run: |
          set -euo pipefail
          # Some hosted runner images execute jobs as root. Create a dedicated
          # unprivileged account so this job always exercises the real rootless
          # path instead of merely checking the runner's default identity.
          ci_user=zerun-ci
          if ! id "$ci_user" >/dev/null 2>&1; then
            sudo useradd --create-home --user-group --shell /usr/sbin/nologin "$ci_user"
          fi
          test "$(sudo -u "$ci_user" id -u)" -ne 0

          # RUNNER_TEMP may be inaccessible to a newly-created account on
          # hosted images; /tmp is intentionally traversable by unprivileged
          # users, so keep every executable and runtime path below it.
          base="/tmp/zerun-rootless-${GITHUB_RUN_ID:-$$}"
          rootfs="$base/rootfs"
          data="$base/data"
          runtime="$base/runtime"
          home="$base/home"
          binary="$base/zerun"
          mkdir -p "$rootfs/bin" "$data" "$runtime" "$home"
          install -m 0755 /usr/bin/busybox "$rootfs/bin/busybox"
          install -m 0755 "$GITHUB_WORKSPACE/target/debug/zerun" "$binary"
          ln -s busybox "$rootfs/bin/sh"
          ln -s busybox "$rootfs/bin/sleep"
          sudo chown -R "$ci_user:" "$rootfs" "$data" "$runtime" "$home"
          sudo chown "$ci_user:" "$binary"

          # Direct exec keeps this smoke focused on rootless namespace and
          # pivot behavior; PID-1/mini-init semantics are covered by the
          # rootful lifecycle smoke tests.
          set +e
          timeout --foreground 30s sudo -u "$ci_user" env \
            HOME="$home" \
            ZERUN_DATA_ROOT="$data" \
            ZERUN_RUNTIME_ROOT="$runtime" \
            "$binary" run --rootfs "$rootfs" --net none --no-overlay -- \
            /bin/sh -c 'printf "rootless-smoke-ok\n"; printf "container-uid=%s\n" "$(/bin/busybox id -u)"' \
            >"$base/output" 2>&1
          status=$?
          set -e
          cat "$base/output"
          if test "$status" -ne 0; then
            echo "rootless workload exited with status $status" >&2
            # Hosted-runner logs are not always available after a failed job;
            # repeat the captured runtime diagnostics as annotations so the
            # next failure identifies clone/mount/exec errors directly.
            while IFS= read -r line; do
              line=${line//\%/%25}
              line=${line//$'\r'/%0D}
              line=${line//$'\n'/%0A}
              echo "::error title=rootless runtime output::$line"
            done <"$base/output"
            exit 90
          fi
          if ! grep -Fx rootless-smoke-ok "$base/output"; then
            echo "rootless workload marker is missing" >&2
            exit 91
          fi
          if ! grep -Fx container-uid=0 "$base/output"; then
            echo "rootless container did not map uid 0" >&2
            exit 92
          fi

          # Exercise exec's pidfd-based namespace join from a non-root host
          # process, including the separate user-namespace join path.
          zerun=(sudo -u "$ci_user" env
            HOME="$home"
            ZERUN_DATA_ROOT="$data"
            ZERUN_RUNTIME_ROOT="$runtime"
            "$binary")
          if ! id="$("${zerun[@]}" run -d --rootfs "$rootfs" --no-overlay --net none \
            --init --name ci-rootless-exec -- /bin/sh -c 'sleep 30' 2>"$base/rootless-run.err")"; then
            while IFS= read -r line; do
              line=${line//\%/%25}
              line=${line//$'\r'/%0D}
              line=${line//$'\n'/%0A}
              echo "::error title=rootless detached run failed::$line"
            done <"$base/rootless-run.err"
            exit 93
          fi
          if ! exec_output="$("${zerun[@]}" exec "$id" /bin/sh -c \
            'printf "rootless-exec-ok uid=%s\n" "$(/bin/busybox id -u)"' 2>"$base/rootless-exec.err")"; then
            while IFS= read -r line; do
              line=${line//\%/%25}
              line=${line//$'\r'/%0D}
              line=${line//$'\n'/%0A}
              echo "::error title=rootless exec failed::$line"
            done <"$base/rootless-exec.err"
            "${zerun[@]}" kill --signal KILL "$id" >/dev/null 2>&1 || true
            exit 94
          fi
          if ! grep -Fx "rootless-exec-ok uid=0" <<<"$exec_output"; then
            echo "::error title=rootless exec output::$exec_output"
            "${zerun[@]}" kill --signal KILL "$id" >/dev/null 2>&1 || true
            exit 95
          fi
          "${zerun[@]}" kill --signal TERM "$id"
          test "$("${zerun[@]}" wait "$id")" = 143
          "${zerun[@]}" rm "$id"

  rootful-integration:
    name: rootful integration (runtime/storage/network)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build test binary
        run: cargo build --locked

      - name: Install runtime fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static curl gcc python3

      - name: Prepare static BusyBox rootfs
        run: |
          set -euo pipefail
          rootfs="$RUNNER_TEMP/zerun-integration-rootfs"
          mkdir -p "$rootfs/bin" "$rootfs/srv"
          install -m 0755 /usr/bin/busybox "$rootfs/bin/busybox"
          for applet in sh httpd ip grep cat sleep; do
            ln -s busybox "$rootfs/bin/$applet"
          done
          printf 'zerun-port-ok\n' >"$rootfs/srv/index.html"
          cat >"$RUNNER_TEMP/zerun-udp-echo.c" <<'EOF'
          #include <arpa/inet.h>
          #include <errno.h>
          #include <netinet/in.h>
          #include <stdlib.h>
          #include <sys/socket.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
              if (argc != 2) return 2;
              int port = atoi(argv[1]);
              int fd = socket(AF_INET, SOCK_DGRAM, 0);
              if (fd < 0) return 1;
              struct sockaddr_in address = {0};
              address.sin_family = AF_INET;
              address.sin_addr.s_addr = htonl(INADDR_ANY);
              address.sin_port = htons((unsigned short)port);
              if (bind(fd, (struct sockaddr *)&address, sizeof(address)) < 0) return 1;
              for (;;) {
                  unsigned char buffer[65535];
                  struct sockaddr_storage peer = {0};
                  socklen_t peer_len = sizeof(peer);
                  ssize_t length = recvfrom(fd, buffer, sizeof(buffer), 0,
                                            (struct sockaddr *)&peer, &peer_len);
                  if (length < 0) {
                      if (errno == EINTR) continue;
                      return 1;
                  }
                  if (sendto(fd, buffer, (size_t)length, 0,
                             (struct sockaddr *)&peer, peer_len) != length) return 1;
              }
          }
          EOF
          cc -static -O2 -Wall -Wextra -o "$rootfs/bin/udp-echo" \
            "$RUNNER_TEMP/zerun-udp-echo.c"
          test -x "$rootfs/bin/udp-echo"

      - name: Run rootful integration checks
        run: |
          set -euo pipefail
          ./ci/rootful-runtime.sh \
            target/debug/zerun \
            "$RUNNER_TEMP/zerun-integration-rootfs" \
            "$RUNNER_TEMP/zerun-integration-data" \
            "$RUNNER_TEMP/zerun-integration-runtime"

  cross:
    name: static build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build static release binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

  musl:
    name: static build (x86_64 musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build static release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
